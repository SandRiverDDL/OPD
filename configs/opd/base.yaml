# Shared OPD configuration.
#
# Experiment-specific YAML files should set `extends: ../base.yaml` and only
# override fields relevant to that experiment.

experiment:
  name: opd_base
  project_name: OnPolicyDistillation

environment:
  hf_student_repo: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  hf_teacher_repo: hbx/JustRL-DeepSeek-1.5B
  hf_dataset_repo: BytedTsinghua-SIA/DAPO-Math-17k
  hf_home_candidates:
    - ${TAIJI_IDE_DEV_DIR}/../.cache/huggingface
    - ${HOME}/.cache/huggingface
  pythonpath_subdir: verl

data:
  train_dataset: datasets/dapo-math-17k.parquet
  train_dataset_name: DAPO-Math-17k
  test_data_dir: datasets/test_data
  train_max_samples: -1
  val_max_samples: -1
  filter_overlong_prompts: true
  shuffle: false

model:
  student_path: null
  teacher_path: null
  student_name: DeepSeek-R1-Distill-Qwen-1.5B
  teacher_name: JustRL-DeepSeek-1.5B
  dtype: fp32

length:
  max_prompt: 1024
  max_response: 7168
  max_val_response: 7168

rollout:
  n_responses: 4
  temperature: 1.0
  teacher_temperature: 1.0
  repetition_penalty: 1.0
  log_prob_top_k: 16
  top_k_strategy: only_stu
  reward_weight_mode: student_p
  vllm_max_num_seqs: 16
  vllm_max_num_batched_tokens: 65536
  vllm_gpu_memory_utilization: 0.85
  val_n: 16

training:
  prompt_batch_size: 64
  ppo_mini_batch_size: 64
  total_epochs: 1
  total_training_steps: null
  learning_rate: 1.0e-6
  adv_estimator: token_reward_direct
  grpo_outcome_weight: 1.0
  use_kl: false
  enable_format_reward: false
  loss_agg_mode: token-mean
  model_max_token_len_per_gpu: 16384
  rollout_log_prob_max_token_len_per_gpu: 16384
  ref_log_prob_max_token_len_per_gpu: 16384
  teacher_max_token_len_per_gpu: 16384
  grad_clip: 1.0

system:
  nnodes: 1
  n_gpus_per_node: 8
  parallel_size: 1
  save_freq: 20
  test_freq: -1
  logger: "['console','swanlab']"
  is_plot: true
  cuda_launch_blocking: true
  tokenizers_parallelism: true
