extends: ../base.yaml

experiment:
  name: opd_prompt32_step80_lr3e-6_poweropd_20260821
  description: >
    PowerOPD sampled-token distillation with a bounded power-transformed
    reward and alpha=5.0.

distillation:
  method: poweropd
  params:
    alpha: 5.0

training:
  prompt_batch_size: 32
  ppo_mini_batch_size: 32
  total_training_steps: 80
  learning_rate: 3.0e-6
