extends: ../base.yaml

experiment:
  name: opd_prompt32_step80_lr3e-6_pruneopd_overlap_20260821
  description: >
    Prune-OPD overlap variant with causal reliability-aware weighting of
    top-k sampled-token OPD rewards.

distillation:
  method: pruneopd
  params:
    top_k: 16
    metric: overlap_ratio
    threshold: 0.7
    w_drop: 0.01
    w_base: 0.5

training:
  prompt_batch_size: 32
  ppo_mini_batch_size: 32
  total_training_steps: 80
  learning_rate: 3.0e-6
